version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Conventional Commits title ("ci(deps): bump ..."), so the commit check passes and the
    # update stays out of the changelog.
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tests/*
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    # One pull request per package update across all projects, not one per project, so the test projects
    # never end up on different versions of the same package.
    groups:
      nuget:
        patterns:
          - "*"
        group-by: dependency-name
    ignore:
      # WiX 6 and later need the Open Source Maintenance Fee EULA accepted (and a paid sponsorship for
      # revenue-generating use); build/build.ps1 refuses anything but WiX 5 on purpose. Move deliberately.
      - dependency-name: wix
        versions:
          - ">= 6"
