name: Release assets

# Builds the MSI, latest.json, .sha256 and ADMX zip for a release and attaches them to it.
# Called by release-please.yml after a release is created; run it by hand to rebuild the
# assets of an existing release (for example after a failed build).
#
# latest.json is what every installed copy polls for updates, so attaching it to a release is what rolls that
# release out to the fleet. Merge the release pull request only when the MSI has been tried on a clean machine.
on:
  workflow_call:
    inputs:
      tag_name:
        description: Release tag to build and attach assets to, e.g. v0.2.0.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to (re)build, e.g. v0.2.0.
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build and attach ${{ inputs.tag_name }}
    runs-on: windows-latest
    env:
      TAG_NAME: ${{ inputs.tag_name }}
      SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name }}

      - name: Version from tag
        shell: pwsh
        run: |
          $version = $env:TAG_NAME -replace '^v', ''
          if ($version -notmatch '^\d{1,3}\.\d{1,3}\.\d{1,5}$') { throw "Tag must look like v1.2.3 (got $env:TAG_NAME)." }
          "VERSION=$version" >> $env:GITHUB_ENV

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        shell: pwsh
        run: ./build/build.ps1 -Task Test -TestScope Windows

      - name: Decode signing certificate
        if: env.SIGNING_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
          "CERT_PATH=$pfx" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: |
          $repoUrl = '${{ github.server_url }}/${{ github.repository }}'
          $tasks = @('Publish')
          $sign = @{}
          if ($env:CERT_PATH) { $tasks += 'Sign'; $sign.CertificatePath = $env:CERT_PATH }
          $tasks += 'Msi', 'Manifest'
          ./build/build.ps1 -Task $tasks -Version $env:VERSION @sign `
            -Commit '${{ github.sha }}' `
            -ProjectUrl $repoUrl `
            -UpdateManifestUrl "$repoUrl/releases/latest/download/latest.json" `
            -ReleaseDownloadUrl "$repoUrl/releases/download/$env:TAG_NAME"

      - name: Attach assets to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = Get-ChildItem out -File | Where-Object { $_.Name -match '\.(msi|sha256|zip)$' -or $_.Name -eq 'latest.json' } | ForEach-Object FullName
          gh release upload $env:TAG_NAME @assets --clobber
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Remove signing certificate
        if: always() && env.CERT_PATH != ''
        shell: pwsh
        run: Remove-Item $env:CERT_PATH -Force -ErrorAction SilentlyContinue
