name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # ErpPrinter.Core builds and tests on any OS, so it runs on the same runner as the other lightweight
  # workflows (commits.yml, release-please.yml): the self-hosted NixOS runner, or ubuntu-latest for fork pull requests.
  core:
    name: Core tests (portable)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    steps:
      - uses: actions/checkout@v7
      # The generic .NET binaries setup-dotnet downloads do not run on NixOS; take the SDK from nixpkgs there.
      # The runner exports DOTNET_ROOT for its own .NET 8, and that wins over the SDK's runtime: the SDK's compiler then
      # fails with "Framework 'Microsoft.NETCore.App' 10.0.x not found". Point every variable the host reads at the SDK.
      - name: Provide the .NET SDK
        if: runner.environment == 'self-hosted'
        run: |
          sdk="$(nix build --no-link --print-out-paths nixpkgs#dotnetCorePackages.sdk_10_0)"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$sdk/share/dotnet" >> "$GITHUB_ENV"
          echo "DOTNET_ROOT_X64=$sdk/share/dotnet" >> "$GITHUB_ENV"
          ls "$sdk/share/dotnet/shared/Microsoft.NETCore.App"
      - uses: actions/setup-dotnet@v6
        if: runner.environment != 'self-hosted'
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/ErpPrinter.Core.Tests/ErpPrinter.Core.Tests.csproj
      - name: Build
        run: dotnet build tests/ErpPrinter.Core.Tests/ErpPrinter.Core.Tests.csproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/ErpPrinter.Core.Tests/ErpPrinter.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=ErpPrinter.Core.Tests.trx" --results-directory out/test-results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-core
          path: out/test-results
          if-no-files-found: ignore

  # Everything that needs Windows: the whole solution, the Windows and Config tests, the self-contained publish and the MSI.
  windows:
    name: Build, Windows tests and MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # WiX 5.0.2 comes from .config/dotnet-tools.json (a repo-local tool), restored by the Msi task.
      - name: Build, test, publish, package
        shell: pwsh
        run: >
          ./build/build.ps1 -Task Build,Test,Publish,Msi,Manifest
          -TestScope Windows
          -Version "0.0.${{ github.run_number }}"
          -Commit "${{ github.sha }}"
          -ProjectUrl "${{ github.server_url }}/${{ github.repository }}"
          -UpdateManifestUrl "${{ github.server_url }}/${{ github.repository }}/releases/latest/download/latest.json"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: out/test-results
          if-no-files-found: ignore
      - name: Upload the MSI
        uses: actions/upload-artifact@v7
        with:
          name: msi
          path: |
            out/*.msi
            out/*.sha256
            out/latest.json
            out/*-admx.zip
      # The published folder is what the MSI packs; keeping it makes a broken MSI easy to diagnose.
      - name: Upload the published payload
        uses: actions/upload-artifact@v7
        with:
          name: payload
          path: out/payload
          retention-days: 7

  e2e:
    name: End-to-end (install, print, deliver, uninstall)
    needs: windows
    runs-on: windows-latest
    # Non-blocking until it has proven stable on the hosted runner image (the Print Spooler and the
    # Print to PDF feature on Windows Server). Flip to false once it is reliably green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: msi
          path: out
      - name: Run
        shell: powershell
        run: |
          $msi = Get-ChildItem out/*.msi | Select-Object -First 1
          ./tests/E2E/Invoke-E2ETest.ps1 -MsiPath $msi.FullName
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics
          path: out/e2e
          if-no-files-found: ignore
