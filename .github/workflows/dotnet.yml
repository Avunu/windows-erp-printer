name: .NET

# CI for the C# port in dotnet/ (see docs/dotnet-port.md). The PowerShell product keeps its own pipeline in
# ci.yml; this one only runs when something the port builds from changes.
on:
  push:
    branches: [main]
    paths:
      - 'dotnet/**'
      - 'installer/ErpPrinter.Service.wxs'
      - 'build/**'
      - 'policies/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/dotnet.yml'
  pull_request:
    paths:
      - 'dotnet/**'
      - 'installer/ErpPrinter.Service.wxs'
      - 'build/**'
      - 'policies/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/dotnet.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # ErpPrinter.Core builds and tests on any OS, so it runs on the same runner as the other lightweight
  # workflows (commits.yml, release-please.yml): the self-hosted NixOS runner, or ubuntu-latest for fork pull requests.
  core:
    name: Core tests (portable)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    steps:
      - uses: actions/checkout@v7
      # The generic .NET binaries setup-dotnet downloads do not run on NixOS; take the SDK from nixpkgs there.
      - name: Provide the .NET SDK
        if: runner.environment == 'self-hosted'
        run: echo "$(nix build --no-link --print-out-paths nixpkgs#dotnetCorePackages.sdk_10_0)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-dotnet@v6
        if: runner.environment != 'self-hosted'
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore dotnet/tests/ErpPrinter.Core.Tests/ErpPrinter.Core.Tests.csproj
      - name: Build
        run: dotnet build dotnet/tests/ErpPrinter.Core.Tests/ErpPrinter.Core.Tests.csproj -c Release --no-restore
      - name: Test
        run: dotnet test dotnet/tests/ErpPrinter.Core.Tests/ErpPrinter.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=ErpPrinter.Core.Tests.trx" --results-directory out/dotnet/test-results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-results-core
          path: out/dotnet/test-results
          if-no-files-found: ignore

  # Everything that needs Windows: the whole solution, the Windows tests, the self-contained publish and the MSI.
  windows:
    name: Build, Windows tests and MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # WiX 5.0.2 comes from .config/dotnet-tools.json (a repo-local tool), restored by the DotnetMsi task.
      - name: Build, test, publish, package
        shell: pwsh
        run: >
          ./build/build.ps1 -Task DotnetBuild, DotnetTest, DotnetPublish, DotnetMsi, DotnetManifest
          -TestScope Windows
          -Version "0.0.${{ github.run_number }}"
          -Commit "${{ github.sha }}"
          -ProjectUrl "${{ github.server_url }}/${{ github.repository }}"
          -UpdateManifestUrl "${{ github.server_url }}/${{ github.repository }}/releases/latest/download/latest.json"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-results-windows
          path: out/dotnet/test-results
          if-no-files-found: ignore
      - name: Upload the MSI
        uses: actions/upload-artifact@v7
        with:
          name: msi-dotnet
          path: |
            out/dotnet/*.msi
            out/dotnet/*.sha256
            out/dotnet/latest.json
      # The published folder is what the MSI packs; keeping it makes a broken MSI easy to diagnose.
      - name: Upload the published payload
        uses: actions/upload-artifact@v7
        with:
          name: payload-dotnet
          path: out/dotnet/payload
          retention-days: 7
