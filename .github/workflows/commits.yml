name: Commits

# release-please derives the next version and CHANGELOG.md from commit messages, so every
# commit in a pull request must follow Conventional Commits. The pull request title is
# checked too, because a squash merge uses it as the commit message.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional:
    name: Conventional Commits
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","nixos"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The self-hosted NixOS runner has no PowerShell preinstalled; put it on PATH from nixpkgs.
      - name: Provide PowerShell
        if: runner.environment == 'self-hosted'
        run: echo "$(nix build --no-link --print-out-paths nixpkgs#powershell)/bin" >> "$GITHUB_PATH"
      - name: Pull request title
        shell: pwsh
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: ./build/Test-CommitMessage.ps1 -Message $env:PR_TITLE
      - name: Commit messages
        shell: pwsh
        run: ./build/Test-CommitMessage.ps1 -From ${{ github.event.pull_request.base.sha }} -To ${{ github.event.pull_request.head.sha }}
